<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="num1" type="text" placeholder="Enter num1">
    <br>
    <input id="num2" type="text" placeholder="Enter num2">
    <br>
    <p id="result"></p>
    <button id="add" onclick="add()">Add</button>
    <button id="sub" onclick="sub()">Sub</button>
    <button id="mul" onclick="mul()">Multiplication</button>
    <button id="div" onclick="div()">Division</button>

    <script>
        function add(){
            let a=Number(document.getElementById("num1").value);
            let b=Number(document.getElementById("num2").value);
            document.getElementById("result").innerText = a+b;
        }
  
        function sub(){
            let a=Number(document.getElementById("num1").value);
            let b=Number(document.getElementById("num2").value);
            document.getElementById("result").innerText = a-b;
        }

        function mul(){
            let a=Number(document.getElementById("num1").value);
            let b=Number(document.getElementById("num2").value);
            document.getElementById("result").innerText = a*b;
        }

        function div(){
            let a=Number(document.getElementById("num1").value);
            let b=Number(document.getElementById("num2").value);
            if(b === 0)
            {
                document.getElementById("result").innerText = "Can't divide by 0";
            }
            else{
                document.getElementById("result").innerText = a/b;
            }
        }
    </script>
</body>
</html>
